name: Offline tests
on:
  push:
    branches: [main]
    # Phone lock sync commits only update this file; a full test run per
    # toggle is noise and cannot validate lock payloads anyway.
    paths-ignore: ["state/locks.json"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m black --check *.py tests
      - run: node --test tests/*.test.cjs
