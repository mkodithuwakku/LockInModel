name: Publish daily dashboard
on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "web/**"
      - "config.yaml"
      - "requirements*.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    # One run at 12:17 Edmonton time; the other UTC slot is skipped (DST).
    - cron: "17 18,19 * * *"
permissions:
  contents: read
concurrency:
  group: pages-dashboard
  cancel-in-progress: false
jobs:
  timing:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.clock.outputs.publish }}
    steps:
      - id: clock
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime, os
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo('America/Edmonton'))
          run = os.environ['EVENT'] != 'schedule' or now.hour == 12
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('publish=' + str(run).lower() + '\n')
          PY
  build:
    needs: timing
    if: needs.timing.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m black --check *.py tests
      - run: node --test tests/pages.test.cjs
      - uses: actions/cache/restore@v4
        id: data-cache
        with:
          path: |
            data/cache/http
            state/pages-report.json
          key: pages-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-data-v1-
      - name: Refresh with pacing and persistent cooldowns
        env:
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
        run: |
          test -n "$SLEEPER_USERNAME" || { echo 'Set the SLEEPER_USERNAME repository secret.'; exit 1; }
          python pages.py --refresh
      - uses: actions/cache/save@v4
        if: always() && steps.data-cache.outcome == 'success'
        with:
          path: |
            data/cache/http
            state/pages-report.json
          key: pages-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
