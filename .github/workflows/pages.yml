name: Publish daily dashboard
on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "web/**"
      - "config.yaml"
      - "requirements*.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    # Alberta stays UTC-6 year-round from November 2026.
    - cron: "17 18 * * *"
permissions:
  contents: read
concurrency:
  group: pages-dashboard
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m black --check *.py tests
      - run: node --test tests/pages.test.cjs
      - uses: actions/cache/restore@v4
        id: data-cache
        with:
          path: |
            data/cache/http
            state/pages-report.json
          key: pages-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-data-v1-
      - name: Refresh with pacing and persistent cooldowns
        env:
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
        run: |
          test -n "$SLEEPER_USERNAME" || { echo 'Set the SLEEPER_USERNAME repository secret.'; exit 1; }
          python pages.py --refresh
      - uses: actions/cache/save@v4
        if: always() && steps.data-cache.outcome == 'success'
        with:
          path: |
            data/cache/http
            state/pages-report.json
          key: pages-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
