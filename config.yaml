  - "Paolo Banchero"
  - "Chet Holmgren"
  - "Jrue Holiday"

# Fantasy scoring weights (edit these to your league)
# Use positive/negative as needed; include only stats you care about.
weights:
  PTS: 0.5
  REB: 1.0
  AST: 1.0
  STL: 2.0
  BLK: 2.0
  TOV: -1.0
  FG3M: 0.5
  FGM: 0.0           # set non-zero if your league counts
  FGA: 0.0
  FTM: 0.0
  FTA: 0.0
  DD: 1
  TD: 2
  PTS40: 2
  PTS50: 2
  # ADD:
  #Technical Foul = -2, Flagrant Foul -2, Double-Double = 1, Triple-Double = 2, 40 Point Bonus = 2, 50 Point Bonus = 2
  #Add them to rare stats

# Decision tuning
decision:
  lookback_games: 10       # for baseline mean/std
  recent_days: 14          # "last two weeks"
  rare_z_threshold: 1.75   # events above this z get rarity boost
  rare_stats: ["BLK", "STL"]  # which stats to treat as rare
  lock_bias_if_rare: 0.15  # add to lock probability when rare event detected
  conservative_mode: false # if true, slightly bias toward locking
  min_remaining_games_bias: 0.05 # adds wait-bias when multiple games remain
  decay: 0.92
  prior_weight_games: 12
  sd_floor_min: 4.0
  career_guard_scale: 0.6
  rookie_guard_fp: 17.5

